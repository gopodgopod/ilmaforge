name: Site check
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check main.js
          node --check project-lure.js
          node --check project-ghx.js
          node --check project-studies.js
          node --check project-duolife.js
          node --check project-canal.js
          node --check project-favorite.js
          node --check project-posnord.js
          node --check scripts/build.mjs
          node --check scripts/build-services.mjs
          node --check content/services.mjs
      - name: Build Cloudflare Pages output
        run: node scripts/build.mjs
      - name: Check static service articles and SEO entry points
        run: node scripts/check-services.mjs
      - name: Verify published entry points
        run: |
          test -s dist/index.html
          test -s dist/main.js
          test -s dist/project-lure.js
          test -s dist/project-lure.css
          test -s dist/project-ghx.js
          test -s dist/project-ghx.css
          test -s dist/project-studies.js
          test -s dist/project-studies.css
          test -s dist/project-duolife.js
          test -s dist/project-duolife.css
          test -s dist/project-canal.js
          test -s dist/project-canal.css
          test -s dist/project-favorite.js
          test -s dist/project-favorite.css
          test -s dist/project-posnord.js
          test -s dist/project-posnord.css
          test -s dist/_redirects
          test -s dist/service-pages.css
          test -s dist/sitemap.xml
          test -s dist/robots.txt
